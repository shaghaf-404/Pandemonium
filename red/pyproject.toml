[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemonium-red"
version = "0.1.0"
description = "AI-driven offensive security agent for the Pandemonium cyber-range (CNC 418)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
schema = ["jsonschema>=4.0"]
dev = ["pytest>=7.0", "pyyaml>=6.0", "jsonschema>=4.0"]

[project.scripts]
pandemo = "pandemonium_red.cli:main"

[tool.setuptools]
packages = ["pandemonium_red"]
